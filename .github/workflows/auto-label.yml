name: Auto Label

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-label:
    name: auto-label
    runs-on: ubuntu-latest
    steps:
      - name: Label PR from title prefix
        uses: actions/github-script@v7
        with:
          script: |
            const categories = { feat: 'feature', fix: 'fix', docs: 'docs', chore: 'chore' };
            const title = context.payload.pull_request.title;
            const match = title.match(/^(feat|fix|docs|chore)(\([^)]*\))?:/);
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            if (!match) {
              core.setFailed(`PR title must start with one of: feat:, fix:, docs:, chore: (got "${title}")`);
              return;
            }

            const label = categories[match[1]];
            const { data: current } = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number });

            const toRemove = current.filter(l => Object.values(categories).includes(l.name) && l.name !== label);
            for (const l of toRemove) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: l.name });
            }

            if (!current.some(l => l.name === label)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
            }
