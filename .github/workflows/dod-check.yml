name: Definition of Done Check

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read
  contents: read

jobs:
  dod-check:
    name: dod-check
    runs-on: ubuntu-latest
    steps:
      - name: Verify Definition of Done checklist
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const lines = body.split('\n');
            const itemPattern = /^-\s*\[( |x|X)\]\s*\*\*(\d)\./;
            const found = {};

            for (const line of lines) {
              const m = line.match(itemPattern);
              if (m) {
                found[m[2]] = { checked: m[1].toLowerCase() === 'x', line };
              }
            }

            const errors = [];
            for (let i = 1; i <= 6; i++) {
              const item = found[String(i)];
              if (!item) {
                errors.push(`Item ${i} is missing from the PR description — did you use the Definition of Done template?`);
                continue;
              }
              const hasNA = /N\/A/i.test(item.line);
              if (!item.checked && !hasNA) {
                errors.push(`Item ${i} is neither checked nor marked "N/A — <reason>".`);
              }
            }

            const title = context.payload.pull_request.title;
            if (!/^(feat|fix|docs|chore)(\([^)]*\))?:/.test(title)) {
              errors.push(`PR title must start with one of feat:, fix:, docs:, chore: so it can be categorized (got "${title}").`);
            }

            const routingMatch = body.match(/##\s*Reviewer routing[^\n]*\n([\s\S]*?)(?:\n##\s|$)/i);
            const routingSection = routingMatch ? routingMatch[1] : '';

            const fenceMatch = routingSection.match(/```[^\n]*\n([\s\S]*?)```/);
            const fenceText = fenceMatch ? fenceMatch[1].trim() : '';

            const quoteText = routingSection
              .split('\n')
              .filter(l => /^>/.test(l.trim()))
              .map(l => l.trim().replace(/^>\s?/, ''))
              .join('\n')
              .trim();

            const routingText = fenceText || quoteText;
            const needsRouting = ['3'].filter(i => found[i]?.checked);
            if (needsRouting.length && !routingText) {
              errors.push(`Item(s) ${needsRouting.join(', ')} are checked as done, but "Reviewer routing" has no answer inside a blockquote (\`> ...\`) or a fenced code block — name who reviewed it and how their sign-off was captured, written inside the quote/fence.`);
            }

            if (errors.length) {
              core.setFailed('Definition of Done check failed:\n- ' + errors.join('\n- '));
            }
