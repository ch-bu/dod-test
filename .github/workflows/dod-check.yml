name: Definition of Done Check

on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled]

permissions:
  pull-requests: read
  contents: read

jobs:
  dod-check:
    name: dod-check
    runs-on: ubuntu-latest
    steps:
      - name: Verify Definition of Done checklist
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const lines = body.split('\n');
            const itemPattern = /^-\s*\[( |x|X)\]\s*\*\*(\d)\./;
            const found = {};

            for (const line of lines) {
              const m = line.match(itemPattern);
              if (m) {
                found[m[2]] = { checked: m[1].toLowerCase() === 'x', line };
              }
            }

            const errors = [];
            for (let i = 1; i <= 7; i++) {
              const item = found[String(i)];
              if (!item) {
                errors.push(`Item ${i} is missing from the PR description — did you use the Definition of Done template?`);
                continue;
              }
              const hasNA = /N\/A/i.test(item.line);
              if (!item.checked && !hasNA) {
                errors.push(`Item ${i} is neither checked nor marked "N/A — <reason>".`);
              }
              if (i === 1 && !item.checked) {
                errors.push('Item 1 (Commit & review) can never be marked N/A — it must be checked.');
              }
            }

            const categoryLabels = ['feature', 'fix', 'docs', 'chore'];
            const labels = context.payload.pull_request.labels.map(l => l.name);
            if (!labels.some(l => categoryLabels.includes(l))) {
              errors.push('No category label (feature/fix/docs/chore) applied — check that the PR title has a valid feat:/fix:/docs:/chore: prefix so auto-labeling can run.');
            }

            if (errors.length) {
              core.setFailed('Definition of Done check failed:\n- ' + errors.join('\n- '));
            }
